{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Zivra AI Fashion Stylist</title>
  <meta name="description" content="Create your Zivra account and unlock personalized AI outfit reviews, virtual wardrobe try-ons, and customized face shape hair styling.">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

  <!-- Root Authentication Container -->
  <main class="auth-split-container">
    

    <!-- Right Side: Registration Form -->
    <section class="auth-form-side">
      <!-- Back Link -->
      <a href="{% url 'landing' %}" class="auth-back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Home
      </a>

      <!-- Glassmorphic Card Container -->
      <div class="auth-card glass">
        <div class="auth-header">
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>

         {% if messages %}
    {% for message in messages %}
        <div class="alert {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
        <form method="POST" id="register-form">
          {% csrf_token %}
          <!-- Full Name -->
          <div class="auth-form-group">
            <label for="fullname" class="auth-label">Full Name</label>
            <div class="auth-input-wrapper">
              <input type="text" id="fullname" name="fullname" class="auth-input" placeholder="e.g. Charlotte Vane" required autocomplete="fullname">
            </div>
          </div>

          <!-- Username -->
          <div class="auth-form-group">
            <label for="username" class="auth-label">Username</label>
            <div class="auth-input-wrapper">
              <input type="text" id="username" name="username" class="auth-input" placeholder="e.g. charlotte_v" required autocomplete="username">
            </div>
          </div>

          <!-- Email -->
          <div class="auth-form-group">
            <label for="email" class="auth-label">Email Address</label>
            <div class="auth-input-wrapper">
              <input type="email" id="email" name="email" class="auth-input" placeholder="e.g. charlotte@zivra.com" required autocomplete="email">
            </div>
          </div>

          <!-- Password -->
          <div class="auth-form-group">
            <label for="password" class="auth-label">Password</label>
            <div class="auth-input-wrapper">
              <input type="password" id="password" name="password" class="auth-input" placeholder="Min. 8 characters" required autocomplete="new-password">
              <button class="auth-input-icon-btn" data-target="password" type="button" aria-label="Toggle Password Visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            
            <!-- Real-time Strength Meter -->
            <div class="strength-meter">
              <div id="strength-bar" class="strength-bar"></div>
            </div>
            <span id="strength-text" class="strength-text"></span>
          </div>

          <!-- Confirm Password -->
          <div class="auth-form-group">
            <label for="confirm-password" class="auth-label">Confirm Password</label>
            <div class="auth-input-wrapper">
              <input name="confirm_password" type="password" id="confirm-password" class="auth-input" placeholder="Re-enter password" required autocomplete="new-password">
              <button class="auth-input-icon-btn" data-target="confirm-password" type="button" aria-label="Toggle Password Visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Terms Checkbox -->
          <div class="auth-checkbox-group">
            <input type="checkbox" name="terms" id="terms" class="auth-checkbox" required>
            <label for="terms" class="auth-checkbox-label">
              I agree to the <a href="#terms">Terms & Conditions</a> and <a href="#privacy">Privacy Policy</a> of Zivra.
            </label>
          </div>

          <!-- Register Submit Button -->
          <button type="submit" class="btn-primary btn-auth-submit">Register</button>

        </form>
      </div>
    </section>

  </main>


<script src="{% static 'js/register.js' %}"></script>
</body>
</html>
