{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Zivra AI Fashion Stylist</title>
  <meta name="description" content="Sign in to your Zivra account and access your AI virtual try-on, closet management tools, style reviews, and community connections.">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'styles/login.css' %}">
</head>
<body>

  <!-- Root Authentication Container -->
  <main class="auth-split-container">
  

    <!-- Right Side: Login Form -->
    <section class="auth-form-side">
      <!-- Back Link -->
      <a href="{% url 'landing' %}" class="auth-back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Home
      </a>

      <!-- Glassmorphic Card Container -->
      <div class="auth-card glass auth-login-card">
        <div class="auth-header">
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to continue your AI fashion journey.</p>
        </div>

        <form method="POST" id="login-form" autocomplete="off">
    {% csrf_token %}

          <!-- Email Address -->
          <div class="auth-form-group">
            <label for="email" class="auth-label">Email Address</label>
            <div class="auth-input-wrapper">
              <input
    type="email"
    id="email"
    name="email"
    class="auth-input"
    placeholder="Enter your Email"
    required>
            </div>
          </div>

          <!-- Password -->
          <div class="auth-form-group">
            <label for="password" class="auth-label">Password</label>
            <div class="auth-input-wrapper">
              <input
    type="password"
    id="password"
    name="password"
    class="auth-input"
    placeholder="Enter your password"
    required
    autocomplete="off">
              <button class="auth-input-icon-btn" type="button" aria-label="Toggle Password Visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Options Row (Remember Me & Forgot Password) -->
          <div class="auth-options-row">
            <!-- <div class="auth-checkbox-group" style="margin: 0;">
              <input type="checkbox" id="remember" class="auth-checkbox">
              <label for="remember" class="auth-checkbox-label">Remember Me</label>
            </div> -->
            <a href="#forgot" class="auth-forgot-link">Forgot Password?</a>
          </div>

          <!-- Login Submit Button -->
          <button type="submit" class="btn-primary btn-auth-submit">Login</button>
          
          <!-- <div class="auth-separator">or</div> -->
          
          <!-- Google SSO -->
          <!-- <button type="button" class="btn-google-sso">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button> -->

        </form>
        
        <p class="auth-subtitle" style="margin-top: 2rem; text-align: center;">
          Don't have an account? <a href="{% url 'register' %}">Register</a>
        </p>
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
